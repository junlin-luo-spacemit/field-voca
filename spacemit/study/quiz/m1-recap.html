<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpacemiT M1 测验 · 产品线全景</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2c3240;
    --text: #e4e7ee;
    --text-dim: #9aa3b4;
    --accent: #4d9dff;
    --ok: #2ecc8f;
    --ok-bg: rgba(46, 204, 143, 0.12);
    --bad: #ff5f6d;
    --bad-bg: rgba(255, 95, 109, 0.12);
    --warn: #e8b339;
    --warn-bg: rgba(232, 179, 57, 0.1);
    --src: #8b93a7;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6f9;
      --panel: #ffffff;
      --panel-2: #f0f2f6;
      --border: #dce0e8;
      --text: #1c2029;
      --text-dim: #666f80;
      --accent: #1f6feb;
      --ok: #1a8f5f;
      --ok-bg: rgba(26, 143, 95, 0.09);
      --bad: #d92d3c;
      --bad-bg: rgba(217, 45, 60, 0.08);
      --warn: #a97c10;
      --warn-bg: rgba(169, 124, 16, 0.09);
      --src: #7a8296;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px 80px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    line-height: 1.7; font-size: 15px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }

  header { margin-bottom: 26px; }
  h1 { font-size: 23px; margin: 0 0 8px; letter-spacing: -0.01em; }
  .sub { color: var(--text-dim); font-size: 13.5px; margin: 0; }

  .bar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 11px 16px; margin: 0 -16px 22px;
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .bar .stat { font-size: 13px; color: var(--text-dim); }
  .bar .stat b { color: var(--text); font-variant-numeric: tabular-nums; }
  .bar .spacer { flex: 1; }
  .btn {
    font: inherit; font-size: 13px; cursor: pointer;
    padding: 6px 14px; border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text);
    transition: border-color .15s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .progress-track {
    height: 3px; background: var(--border); border-radius: 2px;
    width: 100%; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: var(--accent); transition: width .25s ease;
  }

  h2.group {
    font-size: 12.5px; letter-spacing: .09em;
    color: var(--text-dim); font-weight: 600;
    margin: 34px 0 6px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .group-note {
    font-size: 13px; color: var(--text-dim);
    margin: 0 0 16px; padding-left: 2px;
  }

  .q {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 11px; padding: 18px 20px; margin-bottom: 13px;
    transition: border-color .2s;
  }
  .q.answered-correct { border-color: color-mix(in srgb, var(--ok) 50%, var(--border)); }
  .q.answered-wrong { border-color: color-mix(in srgb, var(--bad) 50%, var(--border)); }

  .q-head { display: flex; gap: 10px; margin-bottom: 15px; }
  .q-num {
    flex: 0 0 auto; width: 26px; height: 26px; border-radius: 7px;
    background: var(--panel-2); border: 1px solid var(--border);
    display: grid; place-items: center;
    font-size: 12.5px; font-weight: 600; color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .q.answered-correct .q-num { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
  .q.answered-wrong .q-num { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
  .q-text { font-size: 15px; font-weight: 500; padding-top: 1px; }
  .q-type {
    font-size: 11px; font-weight: 600; padding: 1px 7px;
    border-radius: 20px; margin-left: 8px; vertical-align: 1px;
    background: var(--panel-2); color: var(--text-dim);
    border: 1px solid var(--border);
  }

  .opts { display: flex; flex-direction: column; gap: 7px; }
  .opt {
    display: flex; align-items: flex-start; gap: 11px;
    padding: 11px 13px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel-2);
    cursor: pointer; user-select: none;
    transition: border-color .12s, background .12s;
  }
  .opt:hover:not(.locked) { border-color: var(--accent); }
  .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .opt.locked { cursor: default; }
  .opt .key {
    flex: 0 0 auto; width: 21px; height: 21px; border-radius: 5px;
    display: grid; place-items: center;
    font-size: 11.5px; font-weight: 700;
    background: var(--bg); color: var(--text-dim);
    border: 1px solid var(--border); margin-top: 2px;
  }
  .opt .label { flex: 1; font-size: 14px; }

  .opt.is-correct { border-color: var(--ok); background: var(--ok-bg); }
  .opt.is-correct .key { background: var(--ok); color: #fff; border-color: var(--ok); }
  .opt.is-wrong { border-color: var(--bad); background: var(--bad-bg); }
  .opt.is-wrong .key { background: var(--bad); color: #fff; border-color: var(--bad); }
  .opt.dimmed { opacity: .5; }

  .feedback {
    margin-top: 14px; display: none;
    border-left: 3px solid var(--accent);
    padding-left: 0;
  }
  .feedback.show { display: block; }
  .fb-verdict {
    font-size: 13px; font-weight: 600;
    padding: 4px 0 8px;
  }
  .fb-verdict.ok { color: var(--ok); }
  .fb-verdict.bad { color: var(--bad); }
  .fb-body {
    background: var(--panel-2); border-radius: 0 8px 8px 0;
    padding: 12px 15px; font-size: 13.5px; color: var(--text-dim);
  }
  .fb-body b { color: var(--text); font-weight: 600; }
  .fb-body ul { margin: 6px 0 0; padding-left: 19px; }
  .fb-body li { margin-bottom: 4px; }
  .fb-src {
    margin-top: 10px; padding-top: 9px;
    border-top: 1px dashed var(--border);
    font-size: 12.5px; color: var(--src);
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    word-break: break-all;
  }

  /* self-assessment */
  .sa {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 11px; padding: 6px 20px 18px; margin-bottom: 13px;
  }
  .sa-row {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 13px 0; border-bottom: 1px solid var(--border);
  }
  .sa-row:last-child { border-bottom: none; }
  .sa-label { flex: 1 1 260px; font-size: 14px; }
  .sa-opts { display: flex; gap: 6px; }
  .sa-btn {
    font: inherit; font-size: 12.5px; cursor: pointer;
    padding: 4px 12px; border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent; color: var(--text-dim);
    transition: all .15s;
  }
  .sa-btn:hover { border-color: var(--text-dim); color: var(--text); }
  .sa-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sa-btn[aria-pressed="true"][data-v="ok"] { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
  .sa-btn[aria-pressed="true"][data-v="q"] { border-color: var(--warn); background: var(--warn-bg); color: var(--warn); }
  .sa-btn[aria-pressed="true"][data-v="no"] { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }

  .result {
    display: none; margin-top: 30px; padding: 24px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 13px;
  }
  .result.show { display: block; }
  .result .big {
    font-size: 40px; font-weight: 700; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums; line-height: 1.15;
  }
  .result .big small { font-size: 16px; font-weight: 500; color: var(--text-dim); }
  .result .tier { font-size: 14.5px; margin-top: 6px; }
  .result .brk {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px; margin-top: 18px;
  }
  .brk-item {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 9px; padding: 11px 14px;
  }
  .brk-item .n { font-size: 12px; color: var(--text-dim); }
  .brk-item .v { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .review-hint {
    margin-top: 18px; padding: 14px 16px;
    background: var(--warn-bg); border-left: 3px solid var(--warn);
    border-radius: 0 8px 8px 0; font-size: 13.5px;
  }
  .review-hint b { color: var(--text); }

  .revisit { margin-top: 18px; }
  .revisit h3 {
    font-size: 12.5px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-dim); font-weight: 600;
    margin: 0 0 12px; padding-bottom: 7px;
    border-bottom: 1px solid var(--border);
  }
  .rv-item {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 9px; padding: 13px 15px; margin-bottom: 9px;
    border-left: 3px solid var(--border);
  }
  .rv-item.p1 { border-left-color: var(--bad); }
  .rv-item.p2 { border-left-color: var(--warn); }
  .rv-item.p3 { border-left-color: var(--accent); }
  .rv-head {
    display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap;
    font-size: 13.5px; margin-bottom: 8px;
  }
  .rv-badge {
    font-size: 11px; font-weight: 600; padding: 1px 8px;
    border-radius: 20px; white-space: nowrap;
  }
  .rv-badge.bad { background: var(--bad-bg); color: var(--bad); }
  .rv-badge.warn { background: var(--warn-bg); color: var(--warn); }
  .rv-badge.info { background: var(--accent); color: #fff; background: var(--ok-bg); color: var(--ok); }
  .rv-title { flex: 1 1 200px; font-weight: 500; }
  .rv-count { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
  .rv-rewrite {
    margin-top: 7px; padding: 6px 10px; font-size: 12.5px;
    background: var(--bad-bg); color: var(--bad);
    border-radius: 6px; font-weight: 500;
  }
  .rv-snippet {
    font-size: 13px; color: var(--text); line-height: 1.65;
    padding: 9px 12px; margin-top: 4px;
    background: var(--bg); border-radius: 6px;
    border-left: 2px solid var(--accent);
  }
  .rv-snippet::before {
    content: "回看这段"; display: block;
    font-size: 11px; font-weight: 600; letter-spacing: .05em;
    color: var(--text-dim); margin-bottom: 5px;
  }

  .diag-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; align-items: center; }
  .diag-actions .btn.primary {
    border-color: var(--accent); color: var(--accent);
  }
  .copy-note { font-size: 12.5px; color: var(--ok); display: none; }
  .copy-note.show { display: inline; }

  footer {
    margin-top: 38px; padding-top: 18px;
    border-top: 1px solid var(--border);
    font-size: 12.5px; color: var(--text-dim);
  }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>M1 测验 · 产品线全景</h1>
    <p class="sub">基础与应用 10 · 认陷阱 5 · 自评 14 个知识点 — 全部点选，不用写字</p>
  </header>

  <div class="bar">
    <span class="stat">已答 <b id="s-answered">0</b>/15</span>
    <span class="stat">正确 <b id="s-correct">0</b></span>
    <span class="stat">正确率 <b id="s-rate">—</b></span>
    <span class="spacer"></span>
    <button class="btn" id="btn-reset">重做</button>
  </div>

  <div class="progress-track"><div class="progress-fill" id="prog"></div></div>

  <div id="quiz"></div>

  <div class="result" id="result">
    <div class="big"><span id="r-score">0</span><small> / 15</small></div>
    <div class="tier" id="r-tier"></div>
    <div class="brk" id="r-brk"></div>
    <div class="revisit" id="r-revisit"></div>
    <div class="review-hint" id="r-hint"></div>
    <div class="diag-actions">
      <button class="btn primary" id="btn-copy">复制诊断摘要</button>
      <span class="copy-note" id="copy-note">已复制，可直接粘贴给助教</span>
    </div>
  </div>

  <footer>
    课程：<a href="../m1-01-series-naming.md">产品系列与命名规律</a> · <a href="../m1-02-form-factors.md">同一颗芯片的多种形态</a> · <a href="../m1-03-reading-specs.md">读懂规格表里的数字</a><br>
    规范：<a href="../STYLE.md">STYLE.md</a> · 路线：<a href="../ROADMAP.md">ROADMAP.md</a>
  </footer>

</div>

<script>
const DATA = [
  { group: "一、基础与应用", note: "每题只有一项正确。覆盖三课：系列与命名、产品形态、规格数字，含概念题和应用题。选完立即显示答案、解析和来源。", type: "单选", items: [

const LETTERS = ["A", "B", "C", "D"];
const SA_GROUP = DATA.find(g => g.type === "自评");
const SA_ITEMS = SA_GROUP ? SA_GROUP.items : [];
const state = { total: 0, answered: 0, correct: 0, groups: [] };
const FLAT = [];

DATA.forEach((g, gi) => {
  if (g.type === "自评") return;
  state.groups.push({ name: g.group.replace(/^[一二三]、/, ""), total: g.items.length, correct: 0 });
  g.items.forEach(it => FLAT.push({ ...it, gi: state.groups.length - 1 }));
});
state.total = FLAT.length;

const quizEl = document.getElementById("quiz");

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function build() {
  let html = "";
  let n = 0;
  DATA.forEach((g) => {
    html += `<h2 class="group">${g.group}</h2>`;
    html += `<p class="group-note">${g.note}</p>`;

    if (g.type === "自评") {
      html += `<div class="sa">`;
      g.items.forEach((it, si) => {
        html += `<div class="sa-row">
          <div class="sa-label">${it.k}</div>
          <div class="sa-opts" data-sa="${si}">
            <button class="sa-btn" data-v="ok" aria-pressed="false">懂了</button>
            <button class="sa-btn" data-v="q" aria-pressed="false">有疑问</button>
            <button class="sa-btn" data-v="no" aria-pressed="false">没懂</button>
          </div>
        </div>`;
      });
      html += `</div>`;
      return;
    }

    g.items.forEach(it => {
      html += `<div class="q" id="q${n}">
        <div class="q-head">
          <div class="q-num">${n + 1}</div>
          <div class="q-text">${it.q}<span class="q-type">${g.type}</span></div>
        </div>
        <div class="opts" role="group">`;
      it.opts.forEach((o, oi) => {
        html += `<div class="opt" tabindex="0" role="button" data-q="${n}" data-o="${oi}">
          <div class="key">${LETTERS[oi]}</div>
          <div class="label">${esc(o)}</div>
        </div>`;
      });
      html += `</div>
        <div class="feedback" id="f${n}">
          <div class="fb-verdict" id="fv${n}"></div>
          <div class="fb-body">
            <b>解析：</b>${esc(it.e)}
            <ul id="fu${n}"></ul>
            <div class="fb-src">来源：${esc(it.src)}</div>
            <div id="snip${n}"></div>
          </div>
        </div>
      </div>`;
      n++;
    });
  });
  quizEl.innerHTML = html;
}

function choose(qi, oi) {
  const card = document.getElementById("q" + qi);
  if (card.classList.contains("answered-correct") || card.classList.contains("answered-wrong")) return;

  const it = FLAT[qi];
  const correct = oi === it.a;
  const opts = card.querySelectorAll(".opt");

  opts.forEach((el, idx) => {
    el.classList.add("locked");
    el.setAttribute("tabindex", "-1");
    if (idx === it.a) el.classList.add("is-correct");
    else if (idx === oi) el.classList.add("is-wrong");
    else el.classList.add("dimmed");
  });

  card.classList.add(correct ? "answered-correct" : "answered-wrong");

  const fv = document.getElementById("fv" + qi);
  fv.textContent = correct ? "✓ 回答正确" : "✗ 回答错误，正确答案是 " + LETTERS[it.a];
  fv.className = "fb-verdict " + (correct ? "ok" : "bad");

  const ul = document.getElementById("fu" + qi);
  let li = "";
  if (it.wrong) {
    Object.keys(it.wrong).forEach(k => {
      li += `<li><b>${LETTERS[k]}</b>：${esc(it.wrong[k])}</li>`;
    });
  }
  ul.innerHTML = li;
  const snipEl = document.getElementById("snip" + qi);
  if (snipEl) snipEl.innerHTML = it.rv ? '<div class="rv-snippet">' + esc(it.rv) + '</div>' : "";

  document.getElementById("f" + qi).classList.add("show");

  state.answered++;
  if (correct) { state.correct++; state.groups[it.gi].correct++; }
  refresh();
}

function refresh() {
  document.getElementById("s-answered").textContent = state.answered;
  document.getElementById("s-correct").textContent = state.correct;
  document.getElementById("s-rate").textContent =
    state.answered ? Math.round(state.correct / state.answered * 100) + "%" : "—";
  document.getElementById("prog").style.width =
    (state.answered / state.total * 100) + "%";
  if (state.answered === state.total) showResult();
}

function selfEval() {
  const rows = document.querySelectorAll("[data-sa]");
  const need = [];
  rows.forEach((row, i) => {
    const on = row.querySelector('.sa-btn[aria-pressed="true"]');
    if (on && on.dataset.v !== "ok") {
      need.push({ i, k: SA_ITEMS[i].k, v: on.dataset.v });
    }
  });
  return need;
}

const HIST_KEY = "spacemit.m1.history";

function loadHist() {
  try { return JSON.parse(localStorage.getItem(HIST_KEY)) || { attempts: 0, wrongCount: {}, lastWrong: [] }; }
  catch (e) { return { attempts: 0, wrongCount: {}, lastWrong: [] }; }
}
function saveHist(h) {
  try { localStorage.setItem(HIST_KEY, JSON.stringify(h)); } catch (e) {}
}

function buildRevisit() {
  const box = document.getElementById("r-revisit");
  const hist = loadHist();
  const saRows = document.querySelectorAll("[data-sa]");

  const wrong = [];
  document.querySelectorAll(".q").forEach((c, i) => {
    if (c.classList.contains("answered-wrong")) wrong.push(i);
  });

  const items = [];

  wrong.forEach(i => {
    const row = saRows[FLAT[i].sai];
    const btn = row ? row.querySelector('.sa-btn[aria-pressed="true"]') : null;
    const markedOk = btn && btn.dataset.v === "ok";
    const times = hist.wrongCount[i] || 1;
    items.push({ pri: markedOk ? 1 : 2, i, times, markedOk });
  });

  saRows.forEach((row, si) => {
    const btn = row.querySelector('.sa-btn[aria-pressed="true"]');
    if (!btn || btn.dataset.v === "ok") return;
    if (items.some(it => FLAT[it.i].sai === si)) return;
    items.push({ pri: 3, si, v: btn.dataset.v, label: SA_ITEMS[si].k });
  });

  if (!items.length) {
    box.innerHTML = wrong.length === 0
      ? `<h3>不需要回看</h3><div class="rv-item p3"><div class="rv-head"><span class="rv-title">全部答对，自评也没有标出疑问。</span></div><div class="rv-snippet">过几天再重做一次，确认不是靠短期记忆答对的。</div></div>`
      : "";
    return items;
  }

  items.sort((a, b) => a.pri - b.pri || (b.times || 0) - (a.times || 0));

  let html = `<h3>需回看（按优先级）</h3>`;
  items.forEach(it => {
    if (it.pri === 3) {
      const badge = it.v === "no" ? "bad" : "warn";
      const badgeTxt = it.v === "no" ? "没懂" : "有疑问";
      html += `<div class="rv-item p3">
        <div class="rv-head">
          <span class="rv-badge ${badge}">${badgeTxt}</span>
          <span class="rv-title">${esc(it.label)}</span>
        </div>
      </div>`;
      return;
    }
    const q = FLAT[it.i];
    const cls = it.pri === 1 ? "p1" : "p2";
    const badge = it.pri === 1 ? "bad" : "warn";
    const badgeTxt = it.pri === 1 ? "答错且标了懂了" : "答错";
    html += `<div class="rv-item ${cls}">
      <div class="rv-head">
        <span class="rv-badge ${badge}">${badgeTxt}</span>
        <span class="rv-title">Q${it.i + 1} ${esc(q.q)}</span>
        <span class="rv-count">错第 ${it.times} 次</span>
      </div>`;
    if (it.times >= 2) {
      html += `<div class="rv-rewrite">⚠ 同一题已错 ${it.times} 次 —— 更可能是这一节的讲解需要换个说法，而不是再读一遍</div>`;
    }
    if (q.rv) html += `<div class="rv-snippet">${esc(q.rv)}</div>`;
    html += `</div>`;
  });

  box.innerHTML = html;
  return items;
}

function commitHistory() {
  const hist = loadHist();
  hist.attempts = (hist.attempts || 0) + 1;
  const wrongNow = [];
  document.querySelectorAll(".q").forEach((c, i) => {
    if (c.classList.contains("answered-wrong")) {
      hist.wrongCount[i] = (hist.wrongCount[i] || 0) + 1;
      wrongNow.push(i);
    }
  });
  hist.lastWrong = wrongNow;
  hist.lastAt = new Date().toISOString().slice(0, 16).replace("T", " ");
  saveHist(hist);
  return hist;
}

function buildDiag(items) {
  const hist = loadHist();
  const wrong = [];
  document.querySelectorAll(".q").forEach((c, i) => {
    if (c.classList.contains("answered-wrong")) wrong.push(i);
  });
  const need = [];
  document.querySelectorAll("[data-sa]").forEach((row, si) => {
    const b = row.querySelector('.sa-btn[aria-pressed="true"]');
    if (b && b.dataset.v !== "ok") need.push(SA_ITEMS[si].k + (b.dataset.v === "no" ? "（没懂）" : "（有疑问）"));
  });

  const lines = [];
  lines.push(`M1 测验 第 ${hist.attempts} 次 | ${state.correct}/${state.total}`);
  if (wrong.length) {
    lines.push("错：" + wrong.map(i => `Q${i + 1} ${FLAT[i].q}（错第 ${hist.wrongCount[i]} 次）`).join("、"));
  } else {
    lines.push("错：无");
  }
  if (need.length) lines.push("自评疑问：" + need.join("、"));
  const contradiction = wrong.filter(i => {
    const row = document.querySelectorAll("[data-sa]")[FLAT[i].sai];
    const b = row ? row.querySelector('.sa-btn[aria-pressed="true"]') : null;
    return b && b.dataset.v === "ok";
  });
  if (contradiction.length) lines.push("矛盾（标懂了但答错）：" + contradiction.map(i => "Q" + (i + 1)).join("、"));
  const rewrite = wrong.filter(i => hist.wrongCount[i] >= 2);
  if (rewrite.length) lines.push("建议重写讲解：" + rewrite.map(i => "Q" + (i + 1)).join("、"));
  return lines.join("\n");
}

function updateHint() {
  const hint = document.getElementById("r-hint");
  const rated = document.querySelectorAll('.sa-btn[aria-pressed="true"]').length;
  const wrong = [];
  document.querySelectorAll(".q").forEach((c, i) => {
    if (c.classList.contains("answered-wrong")) wrong.push(i);
  });
  const saRows = document.querySelectorAll("[data-sa]");
  const contradiction = wrong.filter(i => {
    const row = saRows[FLAT[i].sai];
    const b = row ? row.querySelector('.sa-btn[aria-pressed="true"]') : null;
    return b && b.dataset.v === "ok";
  });

  let html = "";
  if (!rated) {
    html = `<b>还没有做自评。</b>在第三段按知识点点选，这里会把疑问和错题一起排序。`;
  } else if (contradiction.length) {
    html = `<b style="color:var(--bad)">⚠ ${contradiction.length} 道题答错、但自评标了「懂了」：</b><br>` +
      contradiction.map(i => "· Q" + (i + 1)).join("<br>") +
      `<br><span style="font-size:13px">读的时候以为懂了，做题才发现有偏差。这类优先回看。</span>`;
  } else if (wrong.length) {
    html = `<b>答错 ${wrong.length} 题。</b>按上面清单回看对应小节即可。`;
  } else {
    html = `<b>全对。</b>自评里的疑问也已列在上面。`;
  }
  hint.innerHTML = html;
}
function showResult() {
  const pct = Math.round(state.correct / state.total * 100);
  document.getElementById("r-score").textContent = state.correct;

  let tier;
  if (pct === 100) tier = "全对。基础概念没有混淆。";
  else if (pct >= 87) tier = "基本清楚，看一处错题即可。";
  else if (pct >= 60) tier = "有几处要回看，重点看错题对应的那一课。";
  else tier = "建议重读三篇课，再回来做一遍。";
  document.getElementById("r-tier").textContent = `${pct}% — ${tier}`;

  document.getElementById("r-brk").innerHTML = state.groups
    .map(g => {
      const p = Math.round(g.correct / g.total * 100);
      return `<div class="brk-item">
        <div class="n">${g.name}</div>
        <div class="v">${g.correct}/${g.total} <span style="font-size:12px;font-weight:400;color:var(--text-dim)">${p}%</span></div>
      </div>`;
    }).join("");

  commitHistory();
  buildRevisit();
  updateHint();

  const r = document.getElementById("result");
  r.classList.add("show");
  r.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function reset() {
  state.answered = 0;
  state.correct = 0;
  state.groups.forEach(g => g.correct = 0);
  document.getElementById("result").classList.remove("show");
  document.getElementById("r-revisit").innerHTML = "";
  document.getElementById("r-hint").innerHTML = "";
  document.getElementById("copy-note").classList.remove("show");
  build();
  bind();
  refresh();
  document.getElementById("prog").style.width = "0%";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function bind() {
  quizEl.querySelectorAll(".opt").forEach(el => {
    const act = () => choose(+el.dataset.q, +el.dataset.o);
    el.addEventListener("click", act);
    el.addEventListener("keydown", ev => {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); act(); }
    });
  });

  quizEl.querySelectorAll(".sa-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const group = btn.parentElement;
      group.querySelectorAll(".sa-btn").forEach(b => b.setAttribute("aria-pressed", "false"));
      btn.setAttribute("aria-pressed", "true");
      if (state.answered === state.total) { buildRevisit(); updateHint(); }
    });
  });
}

build();
bind();
document.getElementById("btn-reset").addEventListener("click", reset);

document.getElementById("btn-copy").addEventListener("click", async () => {
  const text = buildDiag();
  const note = document.getElementById("copy-note");
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (err) {}
    document.body.removeChild(ta);
  }
  note.classList.add("show");
  setTimeout(() => note.classList.remove("show"), 2600);
});
</script>
