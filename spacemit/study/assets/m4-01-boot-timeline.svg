<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Arial, sans-serif">
  <defs>
    <style>
      .stage-box { stroke: #333; stroke-width: 2; }
      .stage-title { fill: #fff; font-size: 15px; font-weight: bold; }
      .stage-subtitle { fill: #fff; font-size: 11px; }
      .stage-task { font-size: 11px; fill: #fff; }
      .duration-label { font-size: 13px; fill: #333; font-weight: bold; }
      .time-tick { font-size: 10px; fill: #666; }
      .arrow { stroke: #666; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="450" y="25" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">K3 启动流程时间线</text>
  <text x="450" y="43" text-anchor="middle" font-size="11" fill="#666">从上电到登录界面的典型耗时</text>
  
  <!-- Stage 1: Boot ROM -->
  <rect x="60" y="70" width="140" height="110" rx="6" class="stage-box" fill="#2C5F9E"/>
  <text x="130" y="92" text-anchor="middle" class="stage-title">Boot ROM</text>
  <text x="130" y="108" text-anchor="middle" class="stage-subtitle">(芯片内部，出厂固化)</text>
  <line x1="70" y1="118" x2="190" y2="118" stroke="#fff" stroke-width="1" opacity="0.4"/>
  <text x="130" y="135" text-anchor="middle" class="stage-task">• 检测启动介质</text>
  <text x="130" y="150" text-anchor="middle" class="stage-task">• 加载 FSBL 到 SRAM</text>
  <text x="130" y="165" text-anchor="middle" class="stage-task">• 跳转执行</text>
  
  <text x="130" y="200" text-anchor="middle" class="duration-label">0.1 秒</text>
  <path d="M 200 125 L 230 125" class="arrow"/>
  
  <!-- Stage 2: FSBL -->
  <rect x="230" y="70" width="140" height="110" rx="6" class="stage-box" fill="#2E8B57"/>
  <text x="300" y="92" text-anchor="middle" class="stage-title">FSBL</text>
  <text x="300" y="108" text-anchor="middle" class="stage-subtitle">(运行在 SRAM 中)</text>
  <line x1="240" y1="118" x2="360" y2="118" stroke="#fff" stroke-width="1" opacity="0.4"/>
  <text x="300" y="135" text-anchor="middle" class="stage-task">• 初始化 LPDDR5</text>
  <text x="300" y="150" text-anchor="middle" class="stage-task">• 准备运行环境</text>
  <text x="300" y="165" text-anchor="middle" class="stage-task">• 加载下一阶段</text>
  
  <text x="300" y="200" text-anchor="middle" class="duration-label">0.5 秒</text>
  <path d="M 370 125 L 400 125" class="arrow"/>
  
  <!-- Stage 3: OpenSBI + U-Boot -->
  <rect x="400" y="70" width="180" height="110" rx="6" class="stage-box" fill="#D97706"/>
  <text x="490" y="92" text-anchor="middle" class="stage-title">OpenSBI + U-Boot</text>
  <text x="490" y="108" text-anchor="middle" class="stage-subtitle">(内存已就绪)</text>
  <line x1="410" y1="118" x2="570" y2="118" stroke="#fff" stroke-width="1" opacity="0.4"/>
  <text x="490" y="135" text-anchor="middle" class="stage-task">• 加载 Linux 内核</text>
  <text x="490" y="150" text-anchor="middle" class="stage-task">• 加载设备树</text>
  <text x="490" y="165" text-anchor="middle" class="stage-task">• 跳转到内核入口</text>
  
  <text x="490" y="200" text-anchor="middle" class="duration-label">1-2 秒</text>
  <path d="M 580 125 L 610 125" class="arrow"/>
  
  <!-- Stage 4: Linux -->
  <rect x="610" y="70" width="180" height="110" rx="6" class="stage-box" fill="#B91C1C"/>
  <text x="700" y="92" text-anchor="middle" class="stage-title">Linux 内核 + 系统服务</text>
  <text x="700" y="108" text-anchor="middle" class="stage-subtitle">(用户空间)</text>
  <line x1="620" y1="118" x2="780" y2="118" stroke="#fff" stroke-width="1" opacity="0.4"/>
  <text x="700" y="135" text-anchor="middle" class="stage-task">• 挂载文件系统</text>
  <text x="700" y="150" text-anchor="middle" class="stage-task">• 启动系统服务</text>
  <text x="700" y="165" text-anchor="middle" class="stage-task">• 到达登录界面</text>
  
  <text x="700" y="200" text-anchor="middle" class="duration-label">5-10 秒</text>
  <text x="700" y="215" text-anchor="middle" font-size="10" fill="#666">(最耗时)</text>
  
  <!-- Timeline axis -->
  <line x1="60" y1="250" x2="790" y2="250" stroke="#999" stroke-width="2"/>
  <line x1="60" y1="245" x2="60" y2="255" stroke="#999" stroke-width="2"/>
  <text x="60" y="270" text-anchor="middle" class="time-tick">t=0s</text>
  
  <line x1="200" y1="245" x2="200" y2="255" stroke="#999" stroke-width="2"/>
  <text x="200" y="270" text-anchor="middle" class="time-tick">0.1s</text>
  
  <line x1="370" y1="245" x2="370" y2="255" stroke="#999" stroke-width="2"/>
  <text x="370" y="270" text-anchor="middle" class="time-tick">0.6s</text>
  
  <line x1="580" y1="245" x2="580" y2="255" stroke="#999" stroke-width="2"/>
  <text x="580" y="270" text-anchor="middle" class="time-tick">2.6s</text>
  
  <line x1="790" y1="245" x2="790" y2="255" stroke="#999" stroke-width="2"/>
  <text x="790" y="270" text-anchor="middle" class="time-tick">~12s</text>
  
  <!-- Key observations -->
  <rect x="60" y="295" width="730" height="85" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
  <text x="75" y="315" font-size="12" font-weight="bold" fill="#111827">关键观察：</text>
  <text x="75" y="335" font-size="11" fill="#374151">• 前 0.6 秒：从零到内存可用（Boot ROM 检测介质 + FSBL 初始化 LPDDR5）</text>
  <text x="75" y="352" font-size="11" fill="#374151">• 0.6-2.6 秒：加载阶段（U-Boot 把内核和设备树拷贝到内存）</text>
  <text x="75" y="369" font-size="11" fill="#374151">• 2.6-12 秒：Linux 自身启动（占总时间约 80%，瓶颈在系统服务初始化和文件系统检查）</text>
</svg>
