<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Arial, sans-serif">
  <defs>
    <style>
      .stage-box { stroke: #333; stroke-width: 2; }
      .stage-text { fill: #fff; font-size: 14px; font-weight: bold; }
      .task-text { font-size: 12px; fill: #333; }
      .time-label { font-size: 11px; fill: #666; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .timeline { stroke: #999; stroke-width: 1; stroke-dasharray: 2,2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">K3 启动流程时间线</text>
  <text x="400" y="45" text-anchor="middle" font-size="12" fill="#666">从上电到登录界面（典型耗时）</text>
  
  <!-- Timeline axis -->
  <line x1="50" y1="440" x2="750" y2="440" stroke="#333" stroke-width="2"/>
  <text x="50" y="460" text-anchor="middle" class="time-label">t=0s</text>
  <text x="150" y="460" text-anchor="middle" class="time-label">0.1s</text>
  <text x="300" y="460" text-anchor="middle" class="time-label">0.6s</text>
  <text x="500" y="460" text-anchor="middle" class="time-label">2.6s</text>
  <text x="700" y="460" text-anchor="middle" class="time-label">12s</text>
  
  <!-- Stage 1: Boot ROM (0 - 0.1s) -->
  <rect x="50" y="80" width="100" height="80" rx="4" class="stage-box" fill="#4A90E2"/>
  <text x="100" y="105" text-anchor="middle" class="stage-text">Boot ROM</text>
  <text x="100" y="125" text-anchor="middle" class="stage-text">(芯片内部)</text>
  <text x="100" y="380" text-anchor="middle" class="task-text">检测启动介质</text>
  <text x="100" y="395" text-anchor="middle" class="task-text">加载 FSBL</text>
  <rect x="50" y="370" width="100" height="40" rx="2" fill="none" stroke="#4A90E2" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 100 160 L 100 370" class="timeline"/>
  <text x="175" y="120" class="time-label" font-weight="bold">0.1 秒</text>
  
  <!-- Stage 2: FSBL (0.1s - 0.6s) -->
  <rect x="200" y="80" width="100" height="80" rx="4" class="stage-box" fill="#50C878"/>
  <text x="250" y="105" text-anchor="middle" class="stage-text">FSBL</text>
  <text x="250" y="125" text-anchor="middle" class="stage-text">(运行在 SRAM)</text>
  <text x="250" y="380" text-anchor="middle" class="task-text">初始化 LPDDR5</text>
  <text x="250" y="395" text-anchor="middle" class="task-text">准备运行环境</text>
  <rect x="200" y="370" width="100" height="40" rx="2" fill="none" stroke="#50C878" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 250 160 L 250 370" class="timeline"/>
  <text x="325" y="120" class="time-label" font-weight="bold">0.5 秒</text>
  <path d="M 150 120 L 190 120" class="arrow"/>
  
  <!-- Stage 3: OpenSBI + U-Boot (0.6s - 2.6s) -->
  <rect x="350" y="80" width="150" height="80" rx="4" class="stage-box" fill="#F5A623"/>
  <text x="425" y="100" text-anchor="middle" class="stage-text">OpenSBI</text>
  <text x="425" y="118" text-anchor="middle" class="stage-text">+ U-Boot</text>
  <text x="425" y="138" text-anchor="middle" class="stage-text">(内存已就绪)</text>
  <text x="425" y="375" text-anchor="middle" class="task-text">加载 U-Boot、内核、</text>
  <text x="425" y="390" text-anchor="middle" class="task-text">设备树到内存</text>
  <rect x="350" y="365" width="150" height="40" rx="2" fill="none" stroke="#F5A623" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 425 160 L 425 365" class="timeline"/>
  <text x="525" y="120" class="time-label" font-weight="bold">1-2 秒</text>
  <path d="M 300 120 L 340 120" class="arrow"/>
  
  <!-- Stage 4: Linux Kernel (2.6s - 12s) -->
  <rect x="550" y="80" width="150" height="80" rx="4" class="stage-box" fill="#E65540"/>
  <text x="625" y="100" text-anchor="middle" class="stage-text">Linux 内核</text>
  <text x="625" y="118" text-anchor="middle" class="stage-text">+ 系统服务</text>
  <text x="625" y="138" text-anchor="middle" class="stage-text">(用户空间)</text>
  <text x="625" y="370" text-anchor="middle" class="task-text">挂载文件系统</text>
  <text x="625" y="385" text-anchor="middle" class="task-text">启动服务</text>
  <text x="625" y="400" text-anchor="middle" class="task-text">到达登录界面</text>
  <rect x="550" y="360" width="150" height="55" rx="2" fill="none" stroke="#E65540" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 625 160 L 625 360" class="timeline"/>
  <text x="720" y="100" class="time-label" font-weight="bold">5-10 秒</text>
  <text x="720" y="115" class="time-label">(最耗时)</text>
  <path d="M 500 120 L 540 120" class="arrow"/>
  
  <!-- Key observations -->
  <rect x="50" y="210" width="700" height="140" rx="4" fill="#f9f9f9" stroke="#ccc" stroke-width="1"/>
  <text x="60" y="230" font-size="13" font-weight="bold" fill="#333">关键观察：</text>
  <text x="60" y="255" font-size="12" fill="#333">• 前 0.6 秒：从零到内存可用（Boot ROM 检测 + FSBL 初始化 LPDDR5）</text>
  <text x="60" y="275" font-size="12" fill="#333">• 0.6-2.6 秒：加载阶段（U-Boot 把内核拷贝到内存）</text>
  <text x="60" y="295" font-size="12" fill="#333">• 2.6-12 秒：Linux 自身启动（占总时间 ~80%）</text>
  <text x="60" y="320" font-size="12" fill="#333">• 瓶颈不在硬件，而在系统服务初始化和文件系统检查</text>
  <text x="60" y="340" font-size="11" fill="#666" font-style="italic">注：典型值来自 K3 开发板实测，不同配置会有差异</text>
</svg>
