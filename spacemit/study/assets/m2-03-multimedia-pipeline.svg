<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 615" font-family="Arial, sans-serif">
  <defs>
    <style>
      .subsystem-box { stroke: #374151; stroke-width: 2.5; }
      .subsystem-title { fill: #fff; font-size: 14px; font-weight: bold; }
      .subsystem-subtitle { fill: #fff; font-size: 10px; }
      .subsystem-task { font-size: 10px; fill: #fff; }
      .arrow-record { stroke: #2563EB; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .arrow-playback { stroke: #DC2626; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .data-label { font-size: 10px; font-weight: bold; }
    </style>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2563EB" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#DC2626" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">K3 多媒体处理管道</text>
  <text x="450" y="47" text-anchor="middle" font-size="11" fill="#6B7280">录像与播放完整链路（各子系统通过内存交换数据）</text>
  
  <!-- Legend -->
  <line x1="50" y1="68" x2="100" y2="68" class="arrow-record" stroke-width="3.5"/>
  <text x="108" y="73" font-size="11" fill="#2563EB" font-weight="bold">录像路径</text>
  <line x1="210" y1="68" x2="260" y2="68" class="arrow-playback" stroke-width="3.5"/>
  <text x="268" y="73" font-size="11" fill="#DC2626" font-weight="bold">播放路径</text>
  
  <!-- ============ RECORD PATH (LEFT, shifted left) ============ -->
  <text x="160" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563EB">录像链路</text>
  
  <!-- Camera -->
  <circle cx="160" cy="140" r="28" fill="#FDE68A" stroke="#92400E" stroke-width="2.5"/>
  <text x="160" y="150" text-anchor="middle" font-size="24">📷</text>
  <text x="160" y="180" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">摄像头</text>
  
  <path d="M 160 168 L 160 220" class="arrow-record"/>
  <text x="230" y="195" class="data-label" fill="#2563EB">RAW12 / CSI-2</text>
  
  <!-- Image Subsystem -->
  <rect x="100" y="220" width="120" height="68" rx="5" class="subsystem-box" fill="#1E40AF"/>
  <text x="160" y="240" text-anchor="middle" class="subsystem-title">图像子系统</text>
  <text x="160" y="254" text-anchor="middle" class="subsystem-subtitle">(ISP 处理)</text>
  <line x1="110" y1="262" x2="210" y2="262" stroke="#fff" stroke-width="1" opacity="0.3"/>
  <text x="160" y="275" text-anchor="middle" class="subsystem-task">去噪、白平衡、颜色校正</text>
  
  <path d="M 160 288 L 160 340" class="arrow-record"/>
  <text x="230" y="315" class="data-label" fill="#2563EB">YUV 格式</text>
  
  <!-- Memory buffer (record) -->
  <rect x="110" y="340" width="100" height="38" rx="4" fill="#DBEAFE" stroke="#1E40AF" stroke-width="1.5"/>
  <text x="160" y="355" text-anchor="middle" font-size="11" font-weight="bold" fill="#1E40AF">内存子系统</text>
  <text x="160" y="368" text-anchor="middle" font-size="9" fill="#1E3A8A">(LPDDR5)</text>
  
  <path d="M 160 378 L 160 430" class="arrow-record"/>
  
  <!-- Video Subsystem (encode) -->
  <rect x="100" y="430" width="120" height="68" rx="5" class="subsystem-box" fill="#1E40AF"/>
  <text x="160" y="450" text-anchor="middle" class="subsystem-title">视频子系统</text>
  <text x="160" y="464" text-anchor="middle" class="subsystem-subtitle">(VPU 编码)</text>
  <line x1="110" y1="472" x2="210" y2="472" stroke="#fff" stroke-width="1" opacity="0.3"/>
  <text x="160" y="485" text-anchor="middle" class="subsystem-task">H.264/H.265 压缩</text>
  
  <path d="M 220 464 L 310 464" class="arrow-record"/>
  <text x="265" y="452" class="data-label" fill="#2563EB">压缩后</text>
  
  <!-- Storage (center) -->
  <rect x="310" y="425" width="180" height="78" rx="5" fill="#78350F" stroke="#451A03" stroke-width="2.5"/>
  <text x="400" y="450" text-anchor="middle" font-size="14" font-weight="bold" fill="#FDE68A">内存与存储</text>
  <text x="400" y="469" text-anchor="middle" font-size="11" fill="#FEF3C7">(eMMC / UFS)</text>
  <line x1="320" y1="477" x2="480" y2="477" stroke="#FDE68A" stroke-width="1" opacity="0.4"/>
  <text x="400" y="492" text-anchor="middle" font-size="10" fill="#FEF3C7">持久化保存 H.264</text>
  
  <!-- ============ PLAYBACK PATH (RIGHT, shifted right) ============ -->
  <text x="640" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#DC2626">播放链路</text>
  
  <path d="M 490 464 L 580 464" class="arrow-playback"/>
  <text x="535" y="452" class="data-label" fill="#DC2626">读取</text>
  
  <!-- Video Subsystem (decode) -->
  <rect x="580" y="430" width="120" height="68" rx="5" class="subsystem-box" fill="#B91C1C"/>
  <text x="640" y="450" text-anchor="middle" class="subsystem-title">视频子系统</text>
  <text x="640" y="464" text-anchor="middle" class="subsystem-subtitle">(VPU 解码)</text>
  <line x1="590" y1="472" x2="690" y2="472" stroke="#fff" stroke-width="1" opacity="0.3"/>
  <text x="640" y="485" text-anchor="middle" class="subsystem-task">H.264 → YUV 还原</text>
  
  <path d="M 640 430 L 640 378" class="arrow-playback"/>
  <text x="710" y="405" class="data-label" fill="#DC2626">YUV 格式</text>
  
  <!-- Memory buffer (playback) -->
  <rect x="590" y="340" width="100" height="38" rx="4" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="640" y="355" text-anchor="middle" font-size="11" font-weight="bold" fill="#B91C1C">内存子系统</text>
  <text x="640" y="368" text-anchor="middle" font-size="9" fill="#991B1B">(LPDDR5)</text>
  
  <path d="M 640 340 L 640 288" class="arrow-playback"/>
  <text x="710" y="315" class="data-label" fill="#DC2626">RGB 格式</text>
  
  <!-- Display Subsystem -->
  <rect x="580" y="220" width="120" height="68" rx="5" class="subsystem-box" fill="#B91C1C"/>
  <text x="640" y="240" text-anchor="middle" class="subsystem-title">显示子系统</text>
  <text x="640" y="254" text-anchor="middle" class="subsystem-subtitle">(DPU 合成)</text>
  <line x1="590" y1="262" x2="690" y2="262" stroke="#fff" stroke-width="1" opacity="0.3"/>
  <text x="640" y="275" text-anchor="middle" class="subsystem-task">图层合成、格式转换</text>
  
  <path d="M 640 220 L 640 168" class="arrow-playback"/>
  <text x="710" y="195" class="data-label" fill="#DC2626">MIPI-DSI</text>
  
  <!-- Display -->
  <circle cx="640" cy="140" r="28" fill="#BFDBFE" stroke="#1E3A8A" stroke-width="2.5"/>
  <text x="640" y="150" text-anchor="middle" font-size="24">🖥️</text>
  <text x="640" y="180" text-anchor="middle" font-size="11" fill="#374151" font-weight="bold">屏幕</text>
  
  <!-- Key observation -->
  <rect x="60" y="545" width="780" height="50" rx="4" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
  <text x="75" y="563" font-size="11" font-weight="bold" fill="#111827">关键点：</text>
  <text x="130" y="563" font-size="10" fill="#374151">各子系统通过内存子系统（LPDDR5）交换数据，不直接连接</text>
  <text x="130" y="575" font-size="10" fill="#374151">内存作为所有数据流的中转枢纽，录像和播放路径对称设计</text>
  <text x="130" y="587" font-size="10" fill="#6B7280">两侧内存子系统为同一块 LPDDR5 的不同缓冲区</text>
</svg>