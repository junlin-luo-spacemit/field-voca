<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 580" font-family="Arial, sans-serif">
  <defs>
    <style>
      .stage-box { stroke: #333; stroke-width: 2.5; }
      .stage-title { fill: #fff; font-size: 15px; font-weight: bold; }
      .stage-subtitle { fill: #fff; font-size: 11px; }
      .stage-task { font-size: 11px; fill: #fff; }
      .label-text { font-size: 11px; fill: #374151; }
      .arrow-success { stroke: #16A34A; stroke-width: 3.5; fill: none; marker-end: url(#arrow-green); }
      .arrow-fail { stroke: #DC2626; stroke-width: 2.5; fill: none; marker-end: url(#arrow-red); stroke-dasharray: 5,3; }
      .lock-icon { fill: #FCD34D; stroke: #92400E; stroke-width: 2; }
    </style>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#16A34A" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#DC2626" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="375" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">K3 安全启动验证链（Chain of Trust）</text>
  <text x="375" y="47" text-anchor="middle" font-size="11" fill="#6B7280">每一级验证下一级，任何一级失败则立即停止启动</text>
  
  <!-- eFuse (root of trust) -->
  <rect x="275" y="75" width="200" height="70" rx="6" class="stage-box" fill="#D97706"/>
  <circle cx="315" cy="110" r="14" class="lock-icon"/>
  <text x="338" y="100" text-anchor="start" class="stage-title">eFuse</text>
  <text x="338" y="116" text-anchor="start" class="stage-subtitle">(芯片内部)</text>
  <text x="338" y="130" text-anchor="start" font-size="10" fill="#fff">存储根密钥哈希</text>
  <text x="490" y="105" class="label-text" font-weight="bold">信任根源</text>
  <text x="490" y="121" font-size="10" fill="#6B7280">一次性写入，不可逆</text>
  
  <!-- Arrow to Boot ROM -->
  <path d="M 375 145 L 375 185" class="arrow-success"/>
  <text x="390" y="170" font-size="11" fill="#16A34A" font-weight="bold">验证 ↓</text>
  
  <!-- Stage 1: Boot ROM -->
  <rect x="275" y="185" width="200" height="85" rx="6" class="stage-box" fill="#2C5F9E"/>
  <text x="375" y="207" text-anchor="middle" class="stage-title">Boot ROM</text>
  <text x="375" y="223" text-anchor="middle" class="stage-subtitle">(出厂固化，不可修改)</text>
  <line x1="285" y1="233" x2="465" y2="233" stroke="#fff" stroke-width="1" opacity="0.3"/>
  <text x="375" y="247" text-anchor="middle" class="stage-task">验证 FSBL 签名</text>
  <text x="375" y="261" text-anchor="middle" font-size="10" fill="#93C5FD">用 eFuse 中的根密钥哈希</text>
  
  <!-- Success path 1 -->
  <path d="M 375 270 L 375 310" class="arrow-success"/>
  <text x="390" y="295" font-size="11" fill="#16A34A" font-weight="bold">✓ 通过</text>
  
  <!-- Failure path 1 -->
  <path d="M 475 227 L 590 227" class="arrow-fail"/>
  <rect x="590" y="210" width="130" height="34" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="655" y="225" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">✗ 签名验证失败</text>
  <text x="655" y="237" text-anchor="middle" font-size="9" fill="#991B1B">停止启动</text>
  
  <!-- Stage 2: FSBL -->
  <rect x="275" y="310" width="200" height="85" rx="6" class="stage-box" fill="#2E8B57"/>
  <text x="375" y="332" text-anchor="middle" class="stage-title">FSBL</text>
  <text x="375" y="348" text-anchor="middle" class="stage-subtitle">(eMMC/SD 中)</text>
  <line x1="285" y1="358" x2="465" y2="358" stroke="#fff" stroke-width="1" opacity="0.3"/>
  <text x="375" y="372" text-anchor="middle" class="stage-task">验证 OpenSBI + U-Boot 签名</text>
  <text x="375" y="386" text-anchor="middle" font-size="10" fill="#86EFAC">用 FSBL 内嵌的公钥</text>
  
  <!-- Success path 2 -->
  <path d="M 375 395 L 375 435" class="arrow-success"/>
  <text x="390" y="420" font-size="11" fill="#16A34A" font-weight="bold">✓ 通过</text>
  
  <!-- Failure path 2 -->
  <path d="M 475 352 L 590 352" class="arrow-fail"/>
  <rect x="590" y="335" width="130" height="34" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="655" y="350" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">✗ 签名验证失败</text>
  <text x="655" y="362" text-anchor="middle" font-size="9" fill="#991B1B">停止启动</text>
  
  <!-- Stage 3: U-Boot -->
  <rect x="275" y="435" width="200" height="85" rx="6" class="stage-box" fill="#D97706"/>
  <text x="375" y="457" text-anchor="middle" class="stage-title">U-Boot</text>
  <text x="375" y="473" text-anchor="middle" class="stage-subtitle">(内存中)</text>
  <line x1="285" y1="483" x2="465" y2="483" stroke="#fff" stroke-width="1" opacity="0.3"/>
  <text x="375" y="497" text-anchor="middle" class="stage-task">验证 Linux 内核签名</text>
  <text x="375" y="511" text-anchor="middle" font-size="10" fill="#FDE68A">用 U-Boot 内嵌的公钥</text>
  
  <!-- Success path 3 -->
  <path d="M 275 477 L 230 477" class="arrow-success"/>
  <text x="250" y="472" font-size="11" fill="#16A34A" font-weight="bold">✓</text>
  <text x="210" y="477" text-anchor="end" font-size="11" fill="#16A34A" font-weight="bold">通过</text>
  <text x="210" y="490" text-anchor="end" font-size="9" fill="#6B7280">系统正常运行</text>
  
  <!-- Failure path 3 -->
  <path d="M 475 477 L 590 477" class="arrow-fail"/>
  <rect x="590" y="460" width="130" height="34" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="655" y="475" text-anchor="middle" font-size="10" fill="#991B1B" font-weight="bold">✗ 签名验证失败</text>
  <text x="655" y="487" text-anchor="middle" font-size="9" fill="#991B1B">停止启动</text>
  
  <!-- Key points box -->
  <rect x="40" y="535" width="670" height="35" rx="5" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
  <text x="55" y="552" font-size="11" font-weight="bold" fill="#111827">关键点：</text>
  <text x="105" y="552" font-size="10" fill="#374151">任何一级验证失败，启动立即停止，防止恶意代码运行</text>
  <text x="105" y="564" font-size="10" fill="#374151">eFuse 是信任根源：一旦写入，设备只认签名固件，无法回退（密钥丢失 = 设备报废）</text>
</svg>
